<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probability Lab: The Crazy Spinner!</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-1: #FF6B6B;
            --color-2: #4ECDC4;
            --color-3: #FFD93D;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #E0F2FE;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
        }

        .main-card {
            background: white;
            border-radius: 40px;
            padding: 25px;
            box-shadow: 0 15px 0 #bae6fd;
            max-width: 950px;
            width: 95%;
            border: 8px solid #38bdf8;
            position: relative; /* Required for absolute logo */
            min-height: 550px;
        }

        /* LOGO IN TOP LEFT CORNER */
        .school-logo {
            position: absolute;
            top: 20px;
            left: 25px;
            max-height: 100px;
            width: auto;
            z-index: 10;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #0369a1;
            font-size: 2.2rem;
            margin: 0 0 20px 0;
            text-align: center;
            text-shadow: 2px 2px 0px #e0f2fe;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 850px) {
            .game-area { grid-template-columns: 1fr; margin-top: 60px; }
            .school-logo { max-height: 50px; }
        }

        /* --- LEFT COLUMN (SPINNER & CONTROLS) --- */
        .left-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .spinner-box {
            position: relative;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        #spinner-wheel {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid #334155;
            background: conic-gradient(
                var(--color-1) 0deg 90deg,
                var(--color-3) 90deg 180deg,
                var(--color-1) 180deg 270deg,
                var(--color-2) 270deg 360deg
            );
            transition: transform 3s cubic-bezier(0.15, 0, 0.15, 1);
            position: relative;
        }

        .wheel-label {
            position: absolute;
            font-family: 'Fredoka One', cursive;
            font-size: 35px;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        .l1-a { top: 40px; right: 50px; }
        .l3   { bottom: 40px; right: 50px; }
        .l1-b { bottom: 40px; left: 50px; }
        .l2   { top: 40px; left: 50px; }

        .pointer {
            position: absolute;
            top: -5px;
            z-index: 10;
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #ef4444;
        }

        .total-box {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: #0369a1;
            background: #e0f2fe;
            padding: 8px 25px;
            border-radius: 15px;
            width: 80%;
            text-align: center;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .input-group {
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 50px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 2px solid #e2e8f0;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 60px;
            border: 2px solid #38bdf8;
            border-radius: 10px;
            padding: 5px;
            font-family: 'Fredoka One', cursive;
            text-align: center;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        button {
            font-family: 'Fredoka One', cursive;
            font-size: 1rem;
            padding: 12px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            width: 100%;
        }

        .btn-spin { background: #8b5cf6; box-shadow: 0 4px 0 #6d28d9; }
        .btn-auto { background: #10b981; box-shadow: 0 4px 0 #059669; }
        .btn-bulk { background: #f59e0b; box-shadow: 0 4px 0 #d97706; padding: 8px 15px; width: auto; }
        .btn-reset { background: #94a3b8; box-shadow: 0 4px 0 #64748b; }
        button:active { transform: translateY(3px); box-shadow: none; }

        /* --- RIGHT COLUMN (STATS) --- */
        .stats-container {
            background: #f8fafc;
            border-radius: 30px;
            padding: 15px;
            border: 4px dashed #cbd5e1;
        }

        .bars-flex {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 180px;
            margin-bottom: 15px;
            padding-top: 30px;
            border-bottom: 2px solid #e2e8f0;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            position: relative;
        }

        .bar-top-val {
            font-family: 'Fredoka One', cursive;
            font-size: 1rem;
            color: #334155;
            margin-bottom: 5px;
        }

        .bar {
            width: 45px;
            border-radius: 10px 10px 4px 4px;
            transition: height 0.3s ease-out;
            min-height: 5px;
        }

        .bar-1 { background: var(--color-1); box-shadow: 0 3px 0 #e11d48; }
        .bar-2 { background: var(--color-2); box-shadow: 0 3px 0 #0d9488; }
        .bar-3 { background: var(--color-3); box-shadow: 0 3px 0 #ca8a04; }

        .results-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 5px;
        }

        .results-table td {
            padding: 12px;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            background: white;
            border-radius: 10px;
            font-size: 1.2rem; /* 30% larger */
        }

        .row-1 { color: var(--color-1); border: 2px solid var(--color-1); }
        .row-2 { color: var(--color-2); border: 2px solid var(--color-2); }
        .row-3 { color: var(--color-3); border: 2px solid var(--color-3); }

        @keyframes bounce {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(1.1); }
            100% { transform: scaleY(1); }
        }
        .bounce { animation: bounce 0.3s ease; }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- LOGO IN TOP LEFT -->
        <img src="https://i.ibb.co/5XybhYTG/marymount-logo.png" alt="School Logo" class="school-logo">
        
        <h1>🎡 The Crazy Spinner!</h1>

        <div class="game-area">
            <!-- LEFT SIDE -->
            <div class="left-column">
                <div class="spinner-box">
                    <div class="pointer"></div>
                    <div id="spinner-wheel">
                        <div class="wheel-label l1-a">1</div>
                        <div class="wheel-label l3">3</div>
                        <div class="wheel-label l1-b">1</div>
                        <div class="wheel-label l2">2</div>
                    </div>
                </div>

                <div class="total-box">Total Spins: <span id="total-val">0</span></div>

                <div class="controls">
                    <div class="input-group">
                        <span>Spin</span>
                        <input type="number" id="bulk-num" value="10" min="1">
                        <span>times</span>
                        <button class="btn-bulk" id="btn-bulk">🚀 GO!</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn-spin" id="btn-spin">🎯 Spin Once</button>
                        <button class="btn-auto" id="btn-auto">🔄 Auto-Spin</button>
                        <button class="btn-reset" id="btn-reset">Reset All</button>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="stats-container">
                <div class="bars-flex">
                    <div class="bar-group">
                        <div class="bar-top-val" id="top-val-1">0</div>
                        <div class="bar bar-1" id="bar-1" style="height: 5px;"></div>
                        <div style="font-family:'Fredoka One'; margin-top:5px; color:var(--color-1)">1</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-top-val" id="top-val-2">0</div>
                        <div class="bar bar-2" id="bar-2" style="height: 5px;"></div>
                        <div style="font-family:'Fredoka One'; margin-top:5px; color:var(--color-2)">2</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-top-val" id="top-val-3">0</div>
                        <div class="bar bar-3" id="bar-3" style="height: 5px;"></div>
                        <div style="font-family:'Fredoka One'; margin-top:5px; color:var(--color-3)">3</div>
                    </div>
                </div>

                <table class="results-table">
                    <thead>
                        <tr style="font-size: 0.7rem; color: #64748b;">
                            <th>NUMBER</th>
                            <th>TIMES</th>
                            <th>%</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="row-1"><td>1</td><td id="count-1">0</td><td id="pct-1">0%</td></tr>
                        <tr class="row-2"><td>2</td><td id="count-2">0</td><td id="pct-2">0%</td></tr>
                        <tr class="row-3"><td>3</td><td id="count-3">0</td><td id="pct-3">0%</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playPop() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        let counts = { 1: 0, 2: 0, 3: 0 };
        let total = 0;
        let isSpinning = false;
        let currentRotation = 0;
        let autoInterval = null;

        const wheel = document.getElementById('spinner-wheel');
        const totalDisplay = document.getElementById('total-val');

        function updateUI(winner = null) {
            totalDisplay.innerText = total.toLocaleString();
            [1, 2, 3].forEach(num => {
                document.getElementById(`count-${num}`).innerText = counts[num].toLocaleString();
                document.getElementById(`top-val-${num}`).innerText = counts[num].toLocaleString();
                const pct = total === 0 ? 0 : ((counts[num] / total) * 100).toFixed(1);
                document.getElementById(`pct-${num}`).innerText = pct + "%";
                const maxVal = Math.max(counts[1], counts[2], counts[3], 1);
                const height = (counts[num] / maxVal) * 140;
                const bar = document.getElementById(`bar-${num}`);
                bar.style.height = (height + 5) + 'px';
                if (winner === num) {
                    bar.classList.remove('bounce');
                    void bar.offsetWidth;
                    bar.classList.add('bounce');
                    playPop();
                }
            });
        }

        function spin() {
            if (isSpinning) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isSpinning = true;

            let rand = Math.random();
            let winner, targetAngle; 

            if (rand < 0.5) { winner = 1; targetAngle = Math.random() < 0.5 ? 45 : 225; }
            else if (rand < 0.75) { winner = 3; targetAngle = 135; }
            else { winner = 2; targetAngle = 315; }

            // ANTI-PERFECTION LOGIC (Milestones 4, 8, 12)
            const nextTotal = total + 1;
            if (nextTotal === 4 || nextTotal === 8 || nextTotal === 12) {
                let testCounts = { ...counts };
                testCounts[winner]++;
                const perf1 = nextTotal / 2;
                const perf2 = nextTotal / 4;
                const perf3 = nextTotal / 4;
                if (testCounts[1] === perf1 && testCounts[2] === perf2 && testCounts[3] === perf3) {
                    if (winner === 1) { winner = 2; targetAngle = 315; }
                    else { winner = 1; targetAngle = 45; }
                }
            }

            const extraRotation = (360 - targetAngle);
            currentRotation += 1800 + extraRotation + (360 - (currentRotation % 360));
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            let startTime = Date.now();
            const duration = 3000;
            function tick() {
                let elapsed = Date.now() - startTime;
                if (elapsed < duration) {
                    playTick();
                    let nextTick = 40 + (Math.pow(elapsed / duration, 2) * 400); 
                    setTimeout(tick, nextTick);
                }
            }
            tick();

            setTimeout(() => {
                counts[winner]++;
                total++;
                updateUI(winner);
                isSpinning = false;
            }, duration);
        }

        function bulkSpin() {
            const num = parseInt(document.getElementById('bulk-num').value);
            if (isNaN(num) || num <= 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            for (let i = 0; i < num; i++) {
                const rand = Math.random();
                if (rand < 0.5) counts[1]++;
                else if (rand < 0.75) counts[3]++;
                else counts[2]++;
            }
            total += num;
            currentRotation += 720;
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            updateUI();
            playPop();
        }

        document.getElementById('btn-spin').onclick = spin;
        document.getElementById('btn-bulk').onclick = bulkSpin;
        document.getElementById('btn-auto').onclick = function() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                this.innerText = "🔄 Auto-Spin";
                this.style.background = "#10b981";
            } else {
                spin();
                autoInterval = setInterval(spin, 3500);
                this.innerText = "⏸ Pause";
                this.style.background = "#ef4444";
            }
        };
        document.getElementById('btn-reset').onclick = () => {
            counts = { 1: 0, 2: 0, 3: 0 };
            total = 0;
            currentRotation = 0;
            wheel.style.transform = `rotate(0deg)`;
            updateUI();
        };
        updateUI();
    </script>
</body>
</html>
